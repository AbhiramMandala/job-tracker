
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Worker typecheck
        run: npm run typecheck --workspace=student-job-tracker-worker

      - name: Worker tests
        run: npm test --workspace=student-job-tracker-worker

      - name: Frontend typecheck
        run: npm run typecheck --workspace=student-job-tracker-frontend

      - name: Frontend tests
        run: npm test --workspace=student-job-tracker-frontend

      - name: Frontend build
        run: npm run build --workspace=student-job-tracker-frontend
