<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}JobSetu{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">JobSetu</a>
      <span class="tagline">Evidence-powered job intelligence for Indian freshers</span>
      <nav class="topnav"><a href="/">Search</a><a href="/profile">Profile</a></nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap"><small>JobSetu · job intelligence for Indian freshers · SerpApi-powered</small></div>
  </footer>
</body>
</html>
